<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>亨利广场 · Henry Square</title>
<style>
/*__FONTS__*/
/*__STYLE__*/
</style>
</head>
<body>
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- 羊皮纸毛边 -->
    <filter id="rough-edge" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-edge-sm" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 火漆 -->
    <radialGradient id="wax-red" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#e05a48"/><stop offset="0.45" stop-color="#a8241a"/><stop offset="1" stop-color="#560c06"/>
    </radialGradient>
    <radialGradient id="wax-red-in" cx="60%" cy="65%" r="70%">
      <stop offset="0" stop-color="#c03224"/><stop offset="1" stop-color="#7a140c"/>
    </radialGradient>
    <radialGradient id="wax-green" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#6a9a5c"/><stop offset="0.45" stop-color="#2e5a30"/><stop offset="1" stop-color="#0e2610"/>
    </radialGradient>
    <radialGradient id="wax-green-in" cx="60%" cy="65%" r="70%">
      <stop offset="0" stop-color="#3a6a3a"/><stop offset="1" stop-color="#16361a"/>
    </radialGradient>
    <radialGradient id="wax-gold" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff0b8"/><stop offset="0.45" stop-color="#d4a248"/><stop offset="1" stop-color="#6a4410"/>
    </radialGradient>
    <radialGradient id="wax-gold-in" cx="60%" cy="65%" r="70%">
      <stop offset="0" stop-color="#e8b858"/><stop offset="1" stop-color="#9a6a1e"/>
    </radialGradient>
    <!-- 丝带 -->
    <linearGradient id="rib-wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8402c"/><stop offset="0.5" stop-color="#8a2618"/><stop offset="1" stop-color="#5e140a"/>
    </linearGradient>
    <linearGradient id="rib-slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5a6a"/><stop offset="0.5" stop-color="#2e3a48"/><stop offset="1" stop-color="#1a222c"/>
    </linearGradient>
    <linearGradient id="rib-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe6a2"/><stop offset="0.5" stop-color="#e0b65c"/><stop offset="1" stop-color="#a87a2c"/>
    </linearGradient>
    <linearGradient id="rib-ash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5e54"/><stop offset="0.5" stop-color="#3e3530"/><stop offset="1" stop-color="#221c18"/>
    </linearGradient>
    <linearGradient id="rib-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e8a4a"/><stop offset="0.5" stop-color="#36602c"/><stop offset="1" stop-color="#1c3a18"/>
    </linearGradient>
  </defs>
</svg>
<div id="app"></div>
<div id="ui"></div>
<script>
/*__SCRIPT__*/
</script>
</body>
</html>
